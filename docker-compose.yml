name: mediassist

services:
  postgres:
    image: pgvector/pgvector:pg18
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in .env}
      # Read by docker/postgres/init.sql on the first start only.
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:?Set AUTH_DB_PASSWORD in .env}
      DOCUMENT_DB_PASSWORD: ${DOCUMENT_DB_PASSWORD:?Set DOCUMENT_DB_PASSWORD in .env}
      CHAT_DB_PASSWORD: ${CHAT_DB_PASSWORD:?Set CHAT_DB_PASSWORD in .env}
      CONSULTATION_DB_PASSWORD: ${CONSULTATION_DB_PASSWORD:?Set CONSULTATION_DB_PASSWORD in .env}
      PRESCRIPTION_DB_PASSWORD: ${PRESCRIPTION_DB_PASSWORD:?Set PRESCRIPTION_DB_PASSWORD in .env}
      MEDICINE_AI_DB_PASSWORD: ${MEDICINE_AI_DB_PASSWORD:?Set MEDICINE_AI_DB_PASSWORD in .env}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:?Set NOTIFICATION_DB_PASSWORD in .env}
      AUDIT_DB_PASSWORD: ${AUDIT_DB_PASSWORD:?Set AUDIT_DB_PASSWORD in .env}
      AUDIT_OWNER_DB_PASSWORD: ${AUDIT_OWNER_DB_PASSWORD:?Set AUDIT_OWNER_DB_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18+ images keep their data under /var/lib/postgresql/<version>.
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      # Uses TCP (-h 127.0.0.1), so it only passes after init.sql has finished.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  rabbitmq:
    image: rabbitmq:4-management
    restart: unless-stopped
    # A fixed hostname keeps the same RabbitMQ node name, so the data volume is reused.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?Set RABBITMQ_USER in .env}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Starts only with the services profile: COMPOSE_PROFILES=services in .env, or docker compose --profile services up -d --build
  # (in daily work the service runs on the host with npm run dev, on the same port).
  consultation-service:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/consultation-service/Dockerfile
    restart: unless-stopped
    environment:
      # Same login as in .env, but the hosts are the Docker service names.
      CONSULTATION_DATABASE_URL: postgresql://consultation_service:${CONSULTATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=consultationdb
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      CONSULTATION_SERVICE_PORT: 3002
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_TRANSCRIBE_MODEL: ${OPENAI_TRANSCRIBE_MODEL}
      OPENAI_CLEANUP_MODEL: ${OPENAI_CLEANUP_MODEL}
      OPENAI_TIMEOUT_SEC: ${OPENAI_TIMEOUT_SEC:-25}
      TRANSCRIPTION_OVERLAP_PARTS: ${TRANSCRIPTION_OVERLAP_PARTS:-1}
      AI_ANSWER_TIMEOUT_SEC: ${AI_ANSWER_TIMEOUT_SEC:-60}
    ports:
      - "127.0.0.1:${CONSULTATION_SERVICE_PORT:-3002}:3002"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Prescription Service. Starts only with the services profile, like the Consultation Service above
  # (in daily work it runs on the host with npm run dev, on the same port).
  prescription-service:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/prescription-service/Dockerfile
    restart: unless-stopped
    environment:
      # Same login as in .env, but the hosts are the Docker service names.
      PRESCRIPTION_DATABASE_URL: postgresql://prescription_service:${PRESCRIPTION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=prescriptiondb
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      CONSULTATION_SERVICE_URL: http://consultation-service:3002
      PRESCRIPTION_SERVICE_PORT: 3003
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
    ports:
      - "127.0.0.1:${PRESCRIPTION_SERVICE_PORT:-3003}:3003"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # It reads its queue, which the Consultation Service creates.
      consultation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Notification Service. Starts only with the services profile, like the Consultation Service above
  # (in daily work it runs on the host with npm run dev, on the same port).
  notification-service:
    profiles: ["services"]
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile
    restart: unless-stopped
    environment:
      # Same login as in .env, but the hosts are the Docker service names.
      NOTIFICATION_DATABASE_URL: postgresql://notification_service:${NOTIFICATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=notificationdb
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      NOTIFICATION_SERVICE_PORT: 3004
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AWS_REGION: ${AWS_REGION}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      REMINDER_TIMEZONE: ${REMINDER_TIMEZONE:-Asia/Karachi}
      REMINDER_HOUR: ${REMINDER_HOUR:-9}
    ports:
      - "127.0.0.1:${NOTIFICATION_SERVICE_PORT:-3004}:3004"
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      # It reads its queues, which the Consultation Service creates.
      consultation-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3004/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # AI Pipeline (agent/). Starts only with the services profile, like the Consultation Service above
  # (in daily work it runs on the host: python -m mediassist_agent.run --rabbitmq in agent\).
  # It only connects: until the Consultation Service has created the queues, it tries again every 5 seconds.
  agent:
    profiles: ["services"]
    build:
      context: ./agent
    restart: unless-stopped
    env_file: .env
    environment:
      # Same logins as in .env, but the hosts are the Docker service names.
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MEDICINE_AI_DATABASE_URL: postgresql://medicine_ai_service:${MEDICINE_AI_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

volumes:
  postgres-data:
  rabbitmq-data:
